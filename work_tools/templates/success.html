<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>操作成功</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        padding: 15px;
      }
      .success-container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h2 {
        color: #28a745;
        margin-bottom: 20px;
      }
      .file-info {
        text-align: left;
        margin: 20px 0;
        padding: 15px;
        background-color: #f8f9fa;
        border-radius: 4px;
        word-break: break-all;
      }
      .btn-download {
        background-color: #28a745;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 12px;
      }
      .btn-download:hover {
        background-color: #218838;
        color: white;
      }
      .btn-back {
        margin-top: 15px;
        background-color: #6c757d;
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }
      .btn-back:hover {
        background-color: #5a6268;
        color: white;
      }
    </style>
  </head>
  <body>
    {% include 'sidebar.html' %}

    <div class="success-container">
      <h2>操作成功！</h2>
      <p>SQL文件已生成，请下载后使用。</p>

      <div class="file-info">
        <strong>文件路径：</strong><br />
        {{ filepath }}
      </div>

      <a href="{{ download_url }}" class="btn-download">下载 SQL 文件</a>
      {% if supplement_download_url %}
      <br />
      <a
        href="{{ supplement_download_url }}"
        class="btn-download"
        style="background-color: #198754"
        >下载补充模板文件</a
      >
      {% endif %} {% if fail_download_url %}
      <br />
      <a
        href="{{ fail_download_url }}"
        class="btn-download"
        style="background-color: #dc3545"
        >下载失败明细文件</a
      >
      {% endif %}
      <br />
      <a href="{% url 'unit_change' %}" class="btn-back">返回首页</a>
    </div>
  </body>
</html>
