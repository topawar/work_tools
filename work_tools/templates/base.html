{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}工作集{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    {% block page_css %}{% endblock %}
    <style>
      html, body { height: 100%; }
      body { margin: 0; background-color: #f8f9fa; }
      .layout { display: flex; min-height: 100%; }
      .sidebar { width: 220px; background: #0d6efd; color: #fff; padding: 16px 12px; }
      .brand { font-weight: 700; font-size: 18px; margin-bottom: 12px; display: block; }
      .nav-list { list-style: none; padding: 0; margin: 0; }
      .nav-item { margin-bottom: 6px; }
      .nav-link-side { display: block; color: #fff; text-decoration: none; padding: 10px 12px; border-radius: 6px; font-weight: 500; }
      .nav-link-side:hover { background-color: #0b5ed7; color: #fff; }
      .main { flex: 1; padding: 16px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <span class="brand">工作集</span>
        <ul class="nav-list">
          <li class="nav-item"><a class="nav-link-side" href="{% url 'unit_change' %}">单位信息修改</a></li>
          <li class="nav-item"><a class="nav-link-side" href="{% url 'contract_price' %}">明细单价修改</a></li>
          <li class="nav-item"><a class="nav-link-side" href="{% url 'contract_item' %}">物资编码修改</a></li>
          <li class="nav-item"><a class="nav-link-side" href="{% url 'contract_budget' %}">合同预算修改</a></li>
          <li class="nav-item"><a class="nav-link-side" href="{% url 'gov_report' %}">是否报送国资委</a></li>
          <li class="nav-item"><a class="nav-link-side" href="{% url 'importance' %}">物项重要性修改</a></li>
          <li class="nav-item"><a class="nav-link-side" href="{% url 'enddate' %}">合同失效日期修改</a></li>
        </ul>
      </aside>
      <main class="main">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
  </html>
